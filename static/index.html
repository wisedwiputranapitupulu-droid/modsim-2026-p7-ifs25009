<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slogan & Tagline Generator — DevServe</title>
    <style>
        /* === RESET & VARIABEL === */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0f1117;
            --surface: #1a1d27;
            --card: #22263a;
            --primary: #f59e0b;
            --primary-hover: #d97706;
            --accent: #10b981;
            --accent2: #3b82f6;
            --text: #e2e8f0;
            --muted: #8892a4;
            --border: #2e3347;
            --radius: 12px;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
            --shadow-hover: 0 8px 32px rgba(0, 0, 0, 0.6);
        }

        /* === BASE === */
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, #1e1e2e 100%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
            overflow-x: hidden;
        }

        /* === HEADER === */
        header {
            text-align: center;
            margin-bottom: 2.5rem;
            animation: slideInDown 0.8s ease-out;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--muted);
            margin-top: 0.5rem;
            font-size: 1rem;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        /* === CARD === */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 2rem;
            width: 100%;
            max-width: 720px;
            box-shadow: var(--shadow);
            margin-bottom: 2rem;
            transition: all 0.3s ease;
            animation: fadeInUp 0.8s ease-out;
        }

        .card:hover {
            box-shadow: var(--shadow-hover);
            transform: translateY(-2px);
        }

        .card h2 {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .card h2 i {
            color: var(--primary);
        }

        /* === FORM === */
        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        label {
            display: block;
            font-size: 0.9rem;
            color: var(--muted);
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        input,
        textarea,
        select {
            width: 100%;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0.8rem 1rem;
            color: var(--text);
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s ease;
            outline: none;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.1);
            transform: scale(1.02);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        select option {
            background: var(--card);
        }

        /* === BUTTON === */
        button {
            width: 100%;
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: #111;
            border: none;
            border-radius: 10px;
            padding: 0.9rem;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 0.5rem;
            position: relative;
            overflow: hidden;
        }

        button:hover {
            background: linear-gradient(135deg, var(--primary-hover), #b45309);
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-sm {
            width: auto;
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
            margin: 0;
            background: var(--card);
            color: var(--text);
            border: 1px solid var(--border);
            font-weight: 500;
            border-radius: 8px;
        }

        .btn-sm:hover {
            background: var(--border);
            transform: translateY(-1px);
        }

        /* Loading spinner */
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s ease-in-out infinite;
            margin-right: 0.5rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* === SLOGAN RESULT ITEMS === */
        #result-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .slogan-item {
            background: var(--card);
            border-radius: 10px;
            padding: 1.2rem 1.3rem;
            font-size: 1.1rem;
            font-weight: 500;
            line-height: 1.6;
            animation: fadeInUp 0.5s ease-out;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 0.75rem;
            border-left: 4px solid var(--primary);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .slogan-item:hover {
            transform: translateX(5px);
            box-shadow: var(--shadow);
        }

        .slogan-item:nth-child(even) {
            border-left-color: var(--accent);
        }

        .slogan-item:nth-child(3n) {
            border-left-color: var(--accent2);
        }

        .slogan-text {
            flex: 1;
            position: relative;
        }

        .slogan-text::before {
            content: '"';
            font-size: 2rem;
            color: var(--primary);
            opacity: 0.3;
            position: absolute;
            left: -15px;
            top: -5px;
        }

        .lang-badge {
            display: inline-block;
            background: var(--primary);
            color: #111;
            font-size: 0.7rem;
            padding: 0.2rem 0.6rem;
            border-radius: 999px;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            flex-shrink: 0;
            margin-top: 0.2rem;
            transition: all 0.3s ease;
        }

        .lang-badge:hover {
            transform: scale(1.1);
        }

        .lang-badge.en {
            background: var(--accent2);
            color: #fff;
        }

        .lang-badge.id {
            background: var(--accent);
            color: #fff;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* === HISTORY TABLE === */
        .history-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            border-radius: var(--radius);
            overflow: hidden;
        }

        .history-table th {
            text-align: left;
            padding: 0.75rem 1rem;
            color: var(--muted);
            background: var(--card);
            border-bottom: 1px solid var(--border);
            font-weight: 600;
        }

        .history-table td {
            padding: 0.8rem 1rem;
            border-bottom: 1px solid var(--border);
            color: var(--text);
            vertical-align: top;
            transition: background 0.3s ease;
        }

        .history-table tr:last-child td {
            border-bottom: none;
        }

        .history-table tr:hover td {
            background: rgba(255, 255, 255, 0.05);
        }

        /* === STATUS === */
        #status {
            font-size: 0.9rem;
            margin-top: 1rem;
            min-height: 1.5rem;
            text-align: center;
            font-weight: 500;
        }

        .status-loading { color: var(--accent); }
        .status-error   { color: #f87171; }
        .status-success { color: var(--accent); }

        /* === BADGE === */
        .badge {
            display: inline-block;
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: #111;
            font-size: 0.75rem;
            padding: 0.2rem 0.6rem;
            border-radius: 999px;
            font-weight: 700;
        }

        /* === EMPTY STATE === */
        .empty-state {
            text-align: center;
            color: var(--muted);
            padding: 3rem 0;
            font-size: 1rem;
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        /* === DIVIDER === */
        .divider {
            border: none;
            border-top: 1px solid var(--border);
            margin: 1.5rem 0;
        }

        /* === COPY BUTTON === */
        .copy-btn {
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
            font-size: 0.9rem;
            padding: 0.3rem 0.5rem;
            border-radius: 6px;
            width: auto;
            margin: 0;
            transition: all 0.3s ease;
        }

        .copy-btn:hover {
            background: var(--border);
            color: var(--text);
            transform: scale(1.1);
        }

        /* === RESPONSIVE === */
        @media (max-width: 768px) {
            header h1 {
                font-size: 2rem;
            }
            .card {
                padding: 1.5rem;
            }
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- ===== HEADER ===== -->
    <header>
        <h1><i>🏷️</i> Slogan & Tagline Generator</h1>
        <p>Buat slogan kreatif untuk produk, komunitas, atau kampanyemu — Powered by Delcom</p>
    </header>

    <!-- ===== FORM GENERATE ===== -->
    <div class="card">
        <h2><i>✏️</i> Generate Slogan Baru</h2>

        <div class="form-group">
            <label for="entity_name">Nama Entitas (Produk / Komunitas / Kampanye) *</label>
            <input type="text" id="entity_name" placeholder="contoh: EduTech Nusantara, Warung Kopi Senja..." />
        </div>

        <div class="form-group">
            <label for="description">Deskripsi Singkat *</label>
            <textarea id="description" placeholder="Jelaskan secara singkat apa itu entitas Anda..."></textarea>
        </div>

        <div class="form-group">
            <label for="core_values">Nilai Utama *</label>
            <input type="text" id="core_values" placeholder="contoh: inovasi, inklusif, inspiratif" />
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="total">Jumlah Slogan (1–10) *</label>
                <input type="number" id="total" min="1" max="10" value="5" />
            </div>
            <div class="form-group">
                <label for="language">Bahasa Output</label>
                <select id="language">
                    <option value="id">🇮🇩 Bahasa Indonesia</option>
                    <option value="en">🇬🇧 English</option>
                    <option value="both" selected>🌐 Keduanya (Both)</option>
                </select>
            </div>
        </div>

        <button id="btn-generate" onclick="handleGenerate()"><i>🚀</i> Generate Slogan</button>
        <div id="status"></div>
    </div>

    <!-- ===== HASIL GENERATE ===== -->
    <div class="card" id="result-card" style="display:none;">
        <h2>
            <i>✨</i> Hasil Generate
            <span class="badge" id="result-count">0</span>
        </h2>
        <div id="result-entity" style="font-size:0.9rem; color:var(--muted); margin-bottom:1.5rem;"></div>
        <div id="result-list"></div>
    </div>

    <!-- ===== RIWAYAT SLOGAN ===== -->
    <div class="card">
        <h2 style="justify-content:space-between;">
            <span><i>📋</i> Riwayat Slogan Tersimpan</span>
            <button class="btn-sm" onclick="loadHistory()"><i>↻</i> Refresh</button>
        </h2>
        <div id="history-container">
            <div class="empty-state">
                <i>📂</i>
                Klik Refresh untuk memuat riwayat.
            </div>
        </div>
    </div>

    <!-- ===== SCRIPT ===== -->
    <script>
        const BASE_URL = "";

        function setStatus(msg, type = "") {
            const el = document.getElementById("status");
            el.textContent = msg;
            el.className = type ? `status-${type}` : "";
        }

        // --- Copy to clipboard ---
        function copyText(text, btn) {
            navigator.clipboard.writeText(text).then(() => {
                btn.innerHTML = '<i>✓</i>';
                setTimeout(() => btn.innerHTML = '<i>📋</i>', 1500);
            });
        }

        // --- Generate ---
        async function handleGenerate() {
            const entity_name = document.getElementById("entity_name").value.trim();
            const description = document.getElementById("description").value.trim();
            const core_values = document.getElementById("core_values").value.trim();
            const total = parseInt(document.getElementById("total").value);
            const language = document.getElementById("language").value;
            const btn = document.getElementById("btn-generate");

            if (!entity_name) return setStatus("⚠️ Nama entitas tidak boleh kosong.", "error");
            if (!description) return setStatus("⚠️ Deskripsi tidak boleh kosong.", "error");
            if (!core_values) return setStatus("⚠️ Nilai utama tidak boleh kosong.", "error");
            if (!total || total < 1 || total > 10) return setStatus("⚠️ Jumlah harus antara 1–10.", "error");

            btn.disabled = true;
            btn.innerHTML = '<span class="loading-spinner"></span>Generating...';
            setStatus("⏳ Sedang generate slogan...", "loading");
            document.getElementById("result-card").style.display = "none";

            try {
                const res = await fetch(`${BASE_URL}/slogans/generate`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ entity_name, description, core_values, total, language }),
                });

                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.error || "Request gagal");
                }

                const data = await res.json();
                renderResults(data);
                setStatus(`✅ Berhasil generate ${data.total} slogan!`, "success");
                loadHistory();

            } catch (err) {
                setStatus(`❌ Error: ${err.message}`, "error");
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-rocket"></i> Generate Slogan';
            }
        }

        function renderResults(data) {
            const list = document.getElementById("result-list");
            const card = document.getElementById("result-card");
            const countBadge = document.getElementById("result-count");
            const entityInfo = document.getElementById("result-entity");

            list.innerHTML = "";
            countBadge.textContent = data.total;

            const langLabel = { id: "🇮🇩 Bahasa Indonesia", en: "🇬🇧 English", both: "🌐 Keduanya" };
            entityInfo.textContent = `Entitas: ${data.entity_name} • Bahasa: ${langLabel[data.language] || data.language}`;

            data.data.forEach((item, index) => {
                const div = document.createElement("div");
                div.className = "slogan-item";
                div.style.animationDelay = `${index * 0.1}s`;

                const text = typeof item === "string" ? item : item.text;
                const lang = typeof item === "object" ? item.language : "id";

                div.innerHTML = `
                    <span class="slogan-text">"${text}"</span>
                    <span class="lang-badge ${lang}">${lang.toUpperCase()}</span>
                    <button class="copy-btn" onclick="copyText('${text.replace(/'/g, "\\'")}', this)" title="Salin slogan"><i>📋</i></button>
                `;
                list.appendChild(div);
            });

            card.style.display = "block";
        }

        // --- History ---
        async function loadHistory() {
            const container = document.getElementById("history-container");
            container.innerHTML = `<div class="empty-state"><i>🔄</i> Memuat...</div>`;

            try {
                const res = await fetch(`${BASE_URL}/slogans?page=1&per_page=20`);
                const data = await res.json();

                if (!data.data || data.data.length === 0) {
                    container.innerHTML = `<div class="empty-state"><i>📂</i> Belum ada data tersimpan.</div>`;
                    return;
                }

                const table = document.createElement("table");
                table.className = "history-table";
                table.innerHTML = `
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Slogan / Tagline</th>
                            <th>Bahasa</th>
                            <th>Dibuat</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${data.data.map(s => `
                        <tr>
                            <td>${s.id}</td>
                            <td style="max-width:320px;">${s.text}</td>
                            <td><span class="lang-badge ${s.language}">${(s.language || "id").toUpperCase()}</span></td>
                            <td>${new Date(s.created_at).toLocaleDateString("id-ID", {
                                day: "2-digit", month: "short", year: "numeric"
                            })}</td>
                        </tr>
                        `).join("")}
                    </tbody>
                `;

                container.innerHTML = `
                    <div style="font-size:0.85rem; color:var(--muted); margin-bottom:1rem;">
                        <i>💾</i> Total: ${data.total} slogan tersimpan
                    </div>
                `;
                container.appendChild(table);

            } catch (err) {
                container.innerHTML = `<div class="empty-state" style="color:#f87171;"><i>⚠️</i> Gagal memuat data: ${err.message}</div>`;
            }
        }
    </script>

</body>

</html>
